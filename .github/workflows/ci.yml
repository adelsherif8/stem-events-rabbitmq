name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.4-management
        env:
          RABBITMQ_DEFAULT_USER: stem
          RABBITMQ_DEFAULT_PASS: stem
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: pytest (unit + integration; integration must not skip in CI)
        env:
          RABBITMQ_URL: amqp://stem:stem@localhost:5672/
          REQUIRE_RABBITMQ: "1"
        run: pytest -v -rs

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t stem-events .
