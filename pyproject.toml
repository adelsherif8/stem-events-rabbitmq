[project]
name = "stem-events-rabbitmq"
version = "0.1.0"
description = "Event-driven companion to Stem SaaS: job events over RabbitMQ with retries, idempotency and a DLQ."
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a real RabbitMQ broker (skipped when none is reachable)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
